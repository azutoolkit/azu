name: Spark client

# Rebuilds the Spark browser client from js/azu-spark.js and fails when the checked-in script
# (src/azu/spark/client/azu_spark.js) or the typings differ, and runs the node unit tests. The
# Crystal suite needs no node; this job only runs when the client or its tooling changes.
on:
  push:
    branches: [master]
    paths: ["js/**", "src/azu/spark/client/**", ".github/workflows/spark-client.yml"]
  pull_request:
    branches: [master]
    paths: ["js/**", "src/azu/spark/client/**", ".github/workflows/spark-client.yml"]

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Rebuild the script and typings; fail on a diff
        run: |
          npm run build
          git diff --exit-code -- . ../src/azu/spark/client
