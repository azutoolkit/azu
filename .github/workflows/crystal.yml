name: Crystal CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: crystallang/crystal:1.19.1
    services:
      # Label used to access the service container
      redis:
        # Docker Hub image
        image: redis
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CRYSTAL_ENV: pipeline
      PORT: 4000
      PORT_REUSE: false
      HOST: 0.0.0.0
      REDIS_HOST: redis
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4

      - name: Cache shards dependencies
        uses: actions/cache@v3
        with:
          path: lib
          key: ${{ runner.os }}-shards-${{ hashFiles('**/shard.lock') }}
          restore-keys: |
            ${{ runner.os }}-shards-

      - name: Cache Crystal build artifacts
        uses: actions/cache@v3
        with:
          path: |
            bin/
            .crystal/
          key: ${{ runner.os }}-crystal-build-${{ hashFiles('**/*.cr', '**/shard.yml') }}
          restore-keys: |
            ${{ runner.os }}-crystal-build-

      - name: Cache test results
        uses: actions/cache@v3
        with:
          path: .crystal/
          key: ${{ runner.os }}-test-cache-${{ hashFiles('**/*.cr', '**/shard.yml') }}
          restore-keys: |
            ${{ runner.os }}-test-cache-

      - name: Install system dependencies
        run: apt-get update && apt-get install -y libsqlite3-dev

      - name: Install dependencies
        run: shards install

      - name: Build binary to test
        run: |
          cd playground
          shards install
          shards build example_app

      - name: Check code style
        run: crystal tool format --check --exclude lib --exclude playground/lib

      # Every spec file, not a hand-picked list: a file that is not listed here is a file that is
      # never run. spec/azu_spec.cr drives a prebuilt binary and is left out (it is stale).
      - name: Run all specs
        run: crystal spec $(find spec -name '*_spec.cr' | sort)

  # Documentation examples must compile: the docs are only as good as the code they show. Only the
  # files listed in docs/.checked are enforced; the list grows as the docs are brought up to date.
  # The list is split over four runners (`--shard i/4` takes every 4th file), which together cover it all.
  docs:
    name: docs (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: crystallang/crystal:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: shards install

      - name: Every page with crystal blocks is listed in docs/.checked
        run: crystal run scripts/check_docs_listed.cr

      - name: Compile the documented examples
        run: crystal run scripts/check_docs.cr -- --shard ${{ matrix.shard }}/4 $(grep -v '^#' docs/.checked)

  # The same suite on the newest Crystal, so a release of the language never breaks the framework
  # unnoticed. The job above (the oldest supported version) is the one that gates a release.
  test-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: crystallang/crystal:latest
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CRYSTAL_ENV: pipeline
      PORT: 4000
      PORT_REUSE: false
      HOST: 0.0.0.0
      REDIS_HOST: redis
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: apt-get update && apt-get install -y libsqlite3-dev

      - name: Install dependencies
        run: shards install

      - name: Check the example app compiles
        run: |
          cd playground
          shards install
          shards build example_app

      - name: Check code style
        run: crystal tool format --check --exclude lib --exclude playground/lib

      - name: Run all specs
        run: crystal spec $(find spec -name '*_spec.cr' | sort)

  release:
    runs-on: ubuntu-latest
    needs:
      - test
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, 'chore: bump version')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Release Version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false
          search_commit_body: true

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.semver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.semver.outputs.version }}
          name: Release v${{ steps.semver.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Version Bump PR
        if: steps.check_tag.outputs.exists == 'false'
        uses: fjogeleit/yaml-update-action@main
        with:
          valueFile: shard.yml
          propertyPath: version
          value: ${{ steps.semver.outputs.version }}
          branch: version-bump/${{ steps.semver.outputs.version }}
          targetBranch: master
          createPR: true
          message: "chore: bump version to ${{ steps.semver.outputs.version }}"
          title: "chore: bump shard.yml version to ${{ steps.semver.outputs.version }}"
          description: |
            Automated version bump to ${{ steps.semver.outputs.version }}

            This PR updates `shard.yml` to match the latest release tag.
          labels: version-bump,automated
