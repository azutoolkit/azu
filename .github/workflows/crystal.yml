name: Crystal CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# One queue per branch: runs on master never wait behind, or get cancelled by, pull request runs, and
# the newest push to master always runs (the release job leaves a push it is behind to that run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  spark-client:
    uses: ./.github/workflows/spark-client.yml

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: crystallang/crystal:1.22.1
    services:
      # Label used to access the service container
      redis:
        # Docker Hub image, pinned to a major so a new Redis never changes a run unnoticed
        image: redis:7
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: azu_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The Azu::CQL engine path needs a real PostgreSQL: specs fail (not pend) in CI without it.
      AZU_TEST_PG_URL: postgres://postgres:postgres@postgres:5432/azu_test
      # Specs that may be skipped in CI: none. The engine specs need cql >= 0.0.925 (shard.yml) and the service above.
      CRYSTAL_ENV: pipeline
      PORT: 4000
      PORT_REUSE: false
      HOST: 0.0.0.0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AZU_TEST_REDIS_URL: redis://redis:6379/0
      AZU_TEST_SCALE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Cache shards dependencies
        uses: actions/cache@v6
        with:
          path: lib
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.yml', 'playground/shard.yml') }}
          restore-keys: |
            ${{ runner.os }}-shards-

      - name: Cache Crystal build artifacts
        uses: actions/cache@v6
        with:
          path: |
            bin/
            .crystal/
          key: ${{ runner.os }}-crystal-build-${{ hashFiles('**/*.cr', '**/shard.yml') }}
          restore-keys: |
            ${{ runner.os }}-crystal-build-

      - name: Cache test results
        uses: actions/cache@v6
        with:
          path: .crystal/
          key: ${{ runner.os }}-test-cache-${{ hashFiles('**/*.cr', '**/shard.yml') }}
          restore-keys: |
            ${{ runner.os }}-test-cache-

      - name: Install system dependencies
        run: apt-get update && apt-get install -y libsqlite3-dev

      - name: Install dependencies
        run: shards install

      - name: Build binary to test
        run: |
          cd playground
          shards install
          shards build example_app

      # The scripts require ../../src/azu and find their shards in the root lib/, so they type-check from here.
      - name: Check the playground examples compile
        run: for f in playground/examples/*.cr; do crystal build --no-codegen "$f" || exit 1; done

      - name: Check code style
        run: crystal tool format --check --exclude lib --exclude playground/lib

      # .ameba.yml records the findings that predate this step; new code passes every rule.
      - name: Lint
        run: crystal run lib/ameba/bin/ameba.cr -- --no-color -f progress ./src

      # Every spec file, not a hand-picked list: a file that is not listed here is a file that is
      # never run. spec/azu_spec.cr drives a prebuilt binary and is left out (it is stale).
      - name: Run all specs
        run: crystal spec $(find spec -name '*_spec.cr' | sort)

  # Documentation examples must compile: the docs are only as good as the code they show. Only the
  # files listed in docs/.checked are enforced; the list grows as the docs are brought up to date.
  # The list is split over four runners (`--shard i/4` takes every 4th file), which together cover it all.
  docs-shards:
    name: docs-shards (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: crystallang/crystal:1.22.1
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: shards install

      - name: Every page with crystal blocks is listed in docs/.checked
        run: crystal run scripts/check_docs_listed.cr

      - name: Every relative link and anchor in README.md and docs/ resolves
        if: matrix.shard == 1
        run: crystal run scripts/check_doc_links.cr

      - name: Compile the documented examples
        run: crystal run scripts/check_docs.cr -- --shard ${{ matrix.shard }}/4 $(grep -v '^#' docs/.checked)

  # One stable check named `docs` for branch protection: it passes only when every shard passed.
  # Every mermaid block of the docs, through Mermaid's own parser: GitBook shows a block that does not parse as
  # an error box, which no other check notices.
  docs-diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/mermaid/package-lock.json

      - name: Install the parser
        run: npm ci --prefix scripts/mermaid

      - name: Parse every diagram
        run: node scripts/mermaid/parse.mjs $(git ls-files 'docs/*.md' 'docs/**/*.md')

  docs:
    runs-on: ubuntu-latest
    needs: [docs-shards, docs-diagrams]
    if: always()
    steps:
      - name: All documentation shards passed
        run: test "${{ needs.docs-shards.result }}" = "success"

      - name: Every diagram parsed
        run: test "${{ needs.docs-diagrams.result }}" = "success"

  # The same suite on the newest Crystal, so a release of the language never breaks the framework
  # unnoticed. It gates a release together with the job above (the oldest supported version).
  test-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: crystallang/crystal:latest
    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: azu_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The Azu::CQL engine path needs a real PostgreSQL: specs fail (not pend) in CI without it.
      AZU_TEST_PG_URL: postgres://postgres:postgres@postgres:5432/azu_test
      # Specs that may be skipped in CI: none. The engine specs need cql >= 0.0.925 (shard.yml) and the service above.
      CRYSTAL_ENV: pipeline
      PORT: 4000
      PORT_REUSE: false
      HOST: 0.0.0.0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AZU_TEST_REDIS_URL: redis://redis:6379/0
      AZU_TEST_SCALE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: apt-get update && apt-get install -y libsqlite3-dev

      - name: Install dependencies
        run: shards install

      - name: Check the example app compiles
        run: |
          cd playground
          shards install
          shards build example_app

      - name: Check code style
        run: crystal tool format --check --exclude lib --exclude playground/lib

      - name: Run all specs
        run: crystal spec $(find spec -name '*_spec.cr' | sort)

  # The concurrency specs only race with several threads: they run here in a -Dpreview_mt build
  # (4 workers) on the oldest supported Crystal. -Dpreview_mt is deprecated there (it warns, and the build still uses
  # the threaded scheduler); moving to execution contexts is a separate change.
  test-mt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: crystallang/crystal:1.22.1
    env:
      CRYSTAL_ENV: pipeline
      CRYSTAL_WORKERS: "4"
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: apt-get update && apt-get install -y libsqlite3-dev

      - name: Install dependencies
        run: shards install

      - name: Run the concurrency specs with threads
        run: crystal spec -Dpreview_mt spec/azu/mt_stress_spec.cr spec/azu/app_scope_spec.cr spec/azu/graceful_shutdown_spec.cr

  # Every push to master that passes every test job (the oldest and the newest Crystal, the threaded specs and the
  # documentation checks) is a release: the job writes the version into shard.yml,
  # commits it straight to master, tags that commit and creates the GitHub release. No version-bump pull
  # request, and the tagged shard.yml carries the tag's own version.
  #
  # master is protected and GITHUB_TOKEN cannot push past that: set the RELEASE_TOKEN secret to a token of
  # an account allowed to bypass the protection (a fine-grained personal access token with "Contents: read
  # and write" on this repository). Without it the job uses GITHUB_TOKEN, which works only if the
  # protection lets GitHub Actions push. The bump commit carries [skip ci], so it starts no new run.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - spark-client
      - test
      - test-latest
      - test-mt
      - docs
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, 'chore: bump version')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Compute Release Version
        id: semver
        uses: paulhatch/semantic-version@v6.0.5
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false
          search_commit_body: true

      - name: Commit the version to shard.yml, tag it and push both to master
        id: bump
        env:
          VERSION: ${{ steps.semver.outputs.version }}
        run: |
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag exists already, nothing to release"
            exit 0
          fi
          master_moved() { [ "$(git ls-remote origin refs/heads/master | cut -f1)" != "$GITHUB_SHA" ]; }
          if master_moved; then
            echo "::notice::master moved past $GITHUB_SHA; the run of the newer push releases these commits"
            exit 0
          fi

          sed -i -E "s/^version: .*/version: $VERSION/" shard.yml
          grep -qx "version: $VERSION" shard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A pull request that set the version itself leaves nothing to commit: its merge commit is tagged.
          if ! git diff --quiet shard.yml; then
            git commit -m "chore: bump version to $VERSION [skip ci]" shard.yml
          fi
          git tag "$tag"

          # Atomic: master gets the bump together with its tag, or neither changes.
          if ! git push --atomic origin HEAD:refs/heads/master "refs/tags/$tag"; then
            if master_moved; then
              echo "::notice::master moved past $GITHUB_SHA during the release; the run of the newer push releases these commits"
              exit 0
            fi
            echo "::error::Pushing the version bump to master was refused. If the branch protection refused it, set the RELEASE_TOKEN secret (see the comment on the release job)."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: steps.bump.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: Release ${{ steps.bump.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
